name: Build iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign --no-pub --dart-define=LVPAI_UPDATE_ENV=test

      - name: Package unsigned .app
        shell: bash
        run: |
          app_path=build/ios/iphoneos/Runner.app
          test -f "$app_path/Info.plist"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app_path" dist/lvpai-ftp-ios-unsigned.zip
          cd dist
          shasum -a 256 lvpai-ftp-ios-unsigned.zip > lvpai-ftp-ios-unsigned.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lvpai-ftp-ios-unsigned
          path: |
            dist/lvpai-ftp-ios-unsigned.zip
            dist/lvpai-ftp-ios-unsigned.sha256
          if-no-files-found: error
          retention-days: 14
