name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node for printing
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          architecture: x64

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: |
          flutter test --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test 'print-runtime/test/*.test.cjs'

      - name: Build and package Windows x64 release
        run: python tool/package_release.py --platform windows-x64 --channel test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lvpai-ftp-windows-x64
          path: |
            build/releases/test/windows-x64/*.zip
            build/releases/test/windows-x64/release-info.json
          if-no-files-found: error
          retention-days: 14
