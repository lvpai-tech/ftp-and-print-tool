name: Build Windows

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Client update channel'
        type: choice
        required: true
        default: prd
        options: [local, test, prd]
      publish_update:
        description: 'Publish Setup.exe to COS (prd internal build, test/local signed)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    if: '!inputs.publish_update || github.ref == ''refs/heads/dev/huangml'''
    runs-on: windows-2022
    environment: ${{ inputs.publish_update && format('cos-{0}', inputs.channel) || 'desktop-build' }}
    concurrency:
      group: windows-desktop-update-${{ inputs.publish_update && inputs.channel || github.run_id }}
    timeout-minutes: 60
    env:
      PUB_HOSTED_URL: https://pub.dev
      LVPAI_UPDATE_ENV: ${{ inputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node for printing
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          architecture: x64

      - name: Setup Inno Setup compiler
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $compiler = Join-Path $env:RUNNER_TEMP 'inno-setup-6.7.3'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $download
          $hash = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash
          if ($hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') {
            throw 'Inno Setup compiler installer checksum mismatch'
          }
          $install = Start-Process -FilePath $download -ArgumentList @('/PORTABLE=1', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$compiler`"") -WindowStyle Hidden -Wait -PassThru
          $iscc = Join-Path $compiler 'ISCC.exe'
          if ($install.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "Inno Setup compiler installation failed ($($install.ExitCode))"
          }
          "INNO_ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: |
          flutter test --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tool -p test_desktop_publishing.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test 'print-runtime/test/*.test.cjs'

      - name: Build and package Windows x64 release
        if: '!inputs.publish_update || inputs.channel == ''prd'''
        run: python -X utf8 tool/package_release.py --platform windows-x64 --channel "$env:LVPAI_UPDATE_ENV" --iscc "$env:INNO_ISCC"

      - name: Sign and package Windows x64 release
        if: inputs.publish_update && inputs.channel != 'prd'
        env:
          WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGNING_PFX -or -not $env:WINDOWS_SIGNING_PASSWORD) {
            throw 'Windows signing credentials are missing'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'workstation-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX))
            $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
              Where-Object HasPrivateKey | Select-Object -First 1
            if (-not $cert) { throw 'No code signing certificate with a private key found' }
          } finally {
            if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx }
          }
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $signTool = Get-ChildItem -LiteralPath $sdkBin -Directory | Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64/signtool.exe' } |
            Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $signTool) { throw 'SignTool not found' }
          Remove-Item Env:WINDOWS_SIGNING_PFX, Env:WINDOWS_SIGNING_PASSWORD
          python -X utf8 tool/package_release.py --platform windows-x64 --channel "$env:LVPAI_UPDATE_ENV" --iscc "$env:INNO_ISCC" --windows-sign-tool "$signTool" --windows-sign-thumbprint $cert.Thumbprint

      - name: Verify installer and data retention
        run: |
          $setup = Get-Item -Path "build/releases/$env:LVPAI_UPDATE_ENV/windows-x64/*-setup.exe"
          $displayName = switch ($env:LVPAI_UPDATE_ENV) {
            'local' { '帧集快拍（本地版）' }
            'test' { '帧集快拍（测试版）' }
            'prd' { '帧集快拍' }
          }
          if ($setup.VersionInfo.ProductName.Trim() -cne $displayName) { throw 'Setup product name does not match the channel' }
          $app = Join-Path $env:LOCALAPPDATA 'Programs/Lvpai/ZhenjiWorkstation'
          $data = Join-Path $env:APPDATA 'ai.lvpai/lvpai_ftp_client'
          New-Item -ItemType Directory -Path $data -Force | Out-Null
          $fixture = Join-Path $data ('installer-smoke-' + [guid]::NewGuid().ToString('N') + '.txt')
          Set-Content -LiteralPath $fixture -Value 'existing workstation data' -Encoding utf8
          $fixtureHash = (Get-FileHash -LiteralPath $fixture).Hash
          foreach ($pass in 1,2) {
            $install = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /RESTARTEXITCODE=3010' -WindowStyle Hidden -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "Setup failed on pass $pass ($($install.ExitCode))" }
            foreach ($file in 'lvpai_ftp_client.exe', 'data/app.so', 'flutter_windows.dll', 'vcruntime140.dll', 'print-runtime/node.exe', 'print-runtime/src/flutter-bridge.cjs') {
              if (-not (Test-Path -LiteralPath (Join-Path $app $file) -PathType Leaf)) {
                throw "Installation is missing $file"
              }
            }
            if ((Get-FileHash -LiteralPath $fixture).Hash -ne $fixtureHash) { throw 'Setup changed user data' }
          }
          $env:LVPAI_UPDATE_INSTALLER = $setup.FullName
          $env:LVPAI_UPDATE_EXECUTABLE = Join-Path $app 'lvpai_ftp_client.exe'
          $env:LVPAI_UPDATE_SHA256 = (Get-FileHash -LiteralPath $setup.FullName).Hash
          $env:LVPAI_UPDATE_MODE = 'verify'
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes((Get-Content -Raw -Encoding utf8 windows/installer/update.ps1)))
          & powershell.exe -NoProfile -NonInteractive -EncodedCommand $encoded
          $expected = if ($env:SIGNED_UPDATE -eq 'true') { 0 } else { 11 }
          if ($LASTEXITCODE -ne $expected) { throw "Updater verification returned $LASTEXITCODE, expected $expected" }
          $uninstaller = Get-Item -Path (Join-Path $app 'unins*.exe')
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path -LiteralPath (Join-Path $app 'lvpai_ftp_client.exe'))) { throw 'Uninstall failed' }
          if ((Get-FileHash -LiteralPath $fixture).Hash -ne $fixtureHash) { throw 'Uninstall changed user data' }
          exit 0
        env:
          SIGNED_UPDATE: ${{ inputs.publish_update && inputs.channel != 'prd' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lvpai-ftp-windows-x64
          path: |
            build/releases/${{ inputs.channel }}/windows-x64/*.zip
            build/releases/${{ inputs.channel }}/windows-x64/release-info.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload one-click installer
        uses: actions/upload-artifact@v4
        with:
          name: lvpai-ftp-windows-x64-setup
          path: |
            build/releases/${{ inputs.channel }}/windows-x64/*-setup.exe
            build/releases/${{ inputs.channel }}/windows-x64/*-setup.exe.sha256
            build/releases/${{ inputs.channel }}/windows-x64/setup-release-info.json
          if-no-files-found: error
          retention-days: 14

      - name: Install publishing dependencies
        if: inputs.publish_update
        run: python -m pip install cos-python-sdk-v5==1.9.45

      - name: Publish Windows update to COS
        if: inputs.publish_update
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
        run: |
          $setup = Get-Item -Path "build/releases/$env:LVPAI_UPDATE_ENV/windows-x64/*-setup.exe"
          python -X utf8 tool/publish_desktop_update.py --channel "$env:LVPAI_UPDATE_ENV" "$($setup.FullName)"
