name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "platforms;android-36" \
            "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub --dart-define=LVPAI_UPDATE_ENV=test

      - name: Package test APK
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/lvpai-ftp-android-debug.apk
          cd dist
          sha256sum lvpai-ftp-android-debug.apk > lvpai-ftp-android-debug.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lvpai-ftp-android-debug
          path: |
            dist/lvpai-ftp-android-debug.apk
            dist/lvpai-ftp-android-debug.sha256
          if-no-files-found: error
          retention-days: 14
