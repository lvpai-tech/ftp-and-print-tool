name: Build macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build macOS release
        run: flutter build macos --release --dart-define=LVPAI_UPDATE_ENV=test

      - name: Package unsigned .app
        run: |
          set -euo pipefail
          APP_PATH="build/macos/Build/Products/Release/lvpai_ftp_client.app"
          test -d "$APP_PATH"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/lvpai-ftp-macos-unsigned.zip
          shasum -a 256 dist/lvpai-ftp-macos-unsigned.zip | tee dist/lvpai-ftp-macos-unsigned.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lvpai-ftp-macos-unsigned
          path: |
            dist/lvpai-ftp-macos-unsigned.zip
            dist/lvpai-ftp-macos-unsigned.sha256
          if-no-files-found: error
          retention-days: 14
