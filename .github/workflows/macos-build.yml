name: Build macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
      LVPAI_UPDATE_ENV: test
      LVPAI_PRINT_NODE_VERSION: v20.18.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build macOS release
        run: python3 tool/build_macos_ci.py

      - name: Package personal click-to-run zip
        run: |
          set -euo pipefail
          chmod +x tool/package_macos_personal.sh
          tool/package_macos_personal.sh build/macos/Build/Products/Release/lvpai_ftp_client.app
          test -f dist/lvpai-ftp-macos-personal.zip
          test -f dist/lvpai-ftp-macos-personal.sha256

      - name: Package and verify personal DMG
        run: bash tool/package_macos_dmg.sh dist/lvpai-ftp-macos-personal.zip

      - name: Upload personal ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lvpai-ftp-macos-personal
          path: |
            dist/lvpai-ftp-macos-personal.zip
            dist/lvpai-ftp-macos-personal.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload personal DMG
        uses: actions/upload-artifact@v4
        with:
          name: lvpai-ftp-macos-personal-dmg
          path: |
            dist/*-personal.dmg
            dist/*-personal.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
