name: Build macOS

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Client update channel'
        type: choice
        required: true
        default: prd
        options: [local, test, prd]
      publish_update:
        description: 'Sign, notarize and publish the Apple silicon DMG to the selected COS update feed'
        type: boolean
        default: false
      cos_smoke_run_id:
        description: 'Optional Actions run ID for the separate COS test archive (uses cos-test)'
        type: string

permissions:
  contents: read

env:
  LVPAI_UPDATE_ENV: ${{ inputs.channel }}

jobs:
  macos:
    if: inputs.cos_smoke_run_id == '' && (!inputs.publish_update || github.ref == 'refs/heads/dev/huangml')
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
      LVPAI_PRINT_NODE_VERSION: v20.18.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: |
          flutter test
          python3 -m unittest discover -s tool -p test_desktop_publishing.py

      - name: Build macOS release
        run: python3 tool/build_macos_ci.py --channel "$LVPAI_UPDATE_ENV"

      - name: Package personal click-to-run zip
        run: |
          set -euo pipefail
          chmod +x tool/package_macos_personal.sh
          tool/package_macos_personal.sh build/macos/Build/Products/Release/lvpai_ftp_client.app
          test -f dist/lvpai-ftp-macos-personal.zip
          test -f dist/lvpai-ftp-macos-personal.sha256

      - name: Upload personal ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lvpai-ftp-macos-personal
          path: |
            dist/lvpai-ftp-macos-personal.zip
            dist/lvpai-ftp-macos-personal.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Package and verify personal DMG
        run: bash tool/package_macos_dmg.sh dist/lvpai-ftp-macos-personal.zip

      - name: Upload personal DMG
        uses: actions/upload-artifact@v4
        with:
          name: lvpai-ftp-macos-personal-dmg
          path: |
            dist/*-personal.dmg
            dist/*-personal.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-update:
    if: inputs.publish_update
    needs: macos
    runs-on: macos-latest
    timeout-minutes: 45
    environment: ${{ format('cos-{0}', inputs.channel) }}
    concurrency:
      group: macos-arm64-desktop-update-${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: lvpai-ftp-macos-personal
          path: dist
      - name: Sign and notarize the updater-enabled DMG
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ vars.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PROFILE: workstation-update
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          : "${MACOS_SIGNING_P12:?}" "${MACOS_SIGNING_PASSWORD:?}" "${MACOS_SIGN_IDENTITY:?}"
          : "${MACOS_NOTARY_APPLE_ID:?}" "${MACOS_NOTARY_PASSWORD:?}" "${MACOS_NOTARY_TEAM_ID:?}"
          keychain="$RUNNER_TEMP/workstation-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          p12="$RUNNER_TEMP/workstation-signing.p12"
          trap 'rm -f "$p12"; security delete-keychain "$keychain"' EXIT
          printf '%s' "$MACOS_SIGNING_P12" | base64 -D > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          security import "$p12" -k "$keychain" -P "$MACOS_SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          xcrun notarytool store-credentials "$MACOS_NOTARY_PROFILE" --apple-id "$MACOS_NOTARY_APPLE_ID" --password "$MACOS_NOTARY_PASSWORD" --team-id "$MACOS_NOTARY_TEAM_ID"
          unset MACOS_SIGNING_P12 MACOS_SIGNING_PASSWORD MACOS_NOTARY_PASSWORD MACOS_NOTARY_APPLE_ID
          bash tool/package_macos_update.sh dist/lvpai-ftp-macos-personal.zip "$LVPAI_UPDATE_ENV"
      - name: Upload signed distribution DMG
        uses: actions/upload-artifact@v4
        with:
          name: lvpai-ftp-macos-${{ inputs.channel }}-update
          path: |
            build/releases/${{ inputs.channel }}/macos-arm64/*.dmg
            build/releases/${{ inputs.channel }}/macos-arm64/release-info.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Install publishing dependencies
        run: python3 -m pip install cos-python-sdk-v5==1.9.45 cryptography==46.0.5
      - name: Publish macOS update to COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Sparkle-2.10.0.tar.xz"
          curl -fsSL https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz -o "$archive"
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  $archive" | shasum -a 256 -c
          tools="$RUNNER_TEMP/sparkle"
          mkdir -p "$tools"
          tar -xJf "$archive" -C "$tools"
          python3 tool/publish_desktop_update.py --channel "$LVPAI_UPDATE_ENV" \
            --sparkle-sign-tool "$tools/bin/sign_update" "build/releases/$LVPAI_UPDATE_ENV/macos-arm64/"*.dmg

  cos-smoke:
    if: ${{ !inputs.publish_update && inputs.cos_smoke_run_id != '' && github.ref == 'refs/heads/dev/huangml' }}
    runs-on: ubuntu-latest
    environment: cos-test
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download the verified DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: lvpai-ftp-macos-personal-dmg
          run-id: ${{ inputs.cos_smoke_run_id }}
          github-token: ${{ github.token }}
          path: dist/cos-smoke
      - name: Upload the verified DMG to COS in parallel
        env:
          COS_SMOKE_PUT_URL: ${{ secrets.COS_SMOKE_PUT_URL }}
        run: python3 tool/upload_macos_cos_smoke.py dist/cos-smoke
