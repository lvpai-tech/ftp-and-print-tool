uted)}

  function handle(action) {

      case 'cycle': cycle(Number(val)); break;
      case 'mode': state.mode=val; break;
      case 'filter': state.filter=val; break;
      case 'batch': state.active=val; break;
      case 'scan': {
        if(state.mode==='auto'){state.auto=!state.auto;say(state.auto?'原型目录监听已开启':'原型目录监听已暂停');break;}

        batches.unshift({id,card:'6021',count:4,sent:0,status:'uploading',time:'刚刚'});
        state.active=id;state.filter='all';log(`批次 B-${id} 导入 4 张示例照片`);say('已导入示例批次');break;
      }
      case 'finish': batch.sent=batch.count;batch.status='waiting';log(`批次 B-${batch.id} 上传完成`);say('演示上传完成，等待归集回执');break;
      case 'receipt': batch.status='accepted';log(`批次 B-${batch.id} 归集回执已确认`);say('演示归集已确认');break;
      case 'retry': batch.status='uploading';log(`批次 B-${batch.id} 重试未传照片`);say('正在演示重试未传照片');break;
      case 'order': {
        const order=orders.find(item=>item.ref===val);
        showDialog(`工单 ${order.ref}`,`<p>${esc(order.kind)} · 尾号 ${order.card} · 6 寸照片</p><p>${statusPill(order.status)}</p><p>${order.status==='ai'?'全部创意成片就绪后才可出纸。':`${order.count} 张 · 示例打印信息`}</p><menu>${button('模拟出纸','print-order:'+order.ref,{type:'primary',attrs:order.status==='ready'?'':'disabled'})}</menu>`);return;
      }
      case 'print-order': orders.find(item=>item.ref===val).status='done';log(`工单 ${val} 模拟出纸`);closeDialog();say('演示工单标记为已出纸');break;
      case 'ops-filter': setOpsFilter(val);break;
      case 'scene': state.selection=val;break;
      case 'lightbox': {
        const asset=scenes.find(item=>item.id===val);
        showDialog(asset.name,img(asset)+`<p class="muted">${esc(asset.source)} · ${esc(asset.pos)}</p>`);return;
      }
      case 'upload-scene': uploadDialog();return;
      case 'submit-review': scene.status='review';state.opsFilter='all';say('素材已进入演示审核队列');break;
      case 'review': reviewDialog(scene);return;
      case 'reject': scene.status='declined';scene.reason='审核人退回。';state.opsFilter='all';closeDialog();say('演示素材已退回');break;
      case 'bind': state.draft[state.scenic]=scene;movePage('binding');say('已设为套餐展示图草稿');break;
      case 'visitor': showDialog('游客端预览',`<figure class="phone-card">${img(draft)}<section><h3>AI 创意摄影套餐</h3><p>${themes[state.scenic]} · ${esc(draft.name)}</p><p class="gallery-tag">${esc(draft.source)} · 风格参考</p></section></figure>`);return;
      case 'publish': showDialog('确认发布配置演练',`<p>目标：<strong>${sites[state.scenic]}</strong> · AI 创意摄影套餐</p><p>展示图：<strong>${esc(draft.name)}</strong> · ${esc(draft.source)}</p><p class="muted">演练结果保存在当前页面，刷新即清空。</p><menu>${button('取消','close')}${button('确认演练发布','confirm-publish',{type:'primary'})}</menu>`);return;
      case 'confirm-publish': state.published[state.scenic]=draft;closeDialog();say('演示发布完成');break;
      case 'recipe': showDialog('生成场景配置步骤',`<div class="summary-row"><span>目标主题</span><strong>${sites[state.scenic]} · ${themes[state.scenic]}</strong></div><p>① 在运营后台切换目标景区，打开「主题管理」的配方区。</p><p>② 选择登记在当前景区的生成背景，保存新的配方版本。</p><p>③ 如幻配置并部署场景，填入已核验的场景 ID、版本和部署证据；火山按配方的场景对象键读取背景。</p><p>④ 先验片，再发布配方并核对游客端可用性。</p>`);return;
      case 'close': closeDialog();return;
      default: return;
    }
    render();
    if(['surface','page','bind'].includes(key)) el('main').focus({preventScroll:true});
  }

  document.addEventListener('click',event=>{
    const control=event.target.closest('button[data-action]');
    if(!control||control.disabled) return;
    event.preventDefault();handle(control.dataset.action);
  });
  document.addEventListener('change',event=>{
    if(event.target.id!=='scenic') return;
    state.scenic=event.target.value; state.selection=siteScenes()[0]?.id;state.opsFilter='all';render();
  });
  document.addEventListener('keydown',event=>{
    if(!['ArrowLeft','ArrowRight'].includes(event.key)||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey||el('dialog').open||state.surface!=='client'||state.page!=='upload'||event.target.closest?.('input,textarea,select,[contenteditable]')) return;
    event.preventDefault();cycle(event.key==='ArrowLeft'?-1:1);render();
  });
  document.addEventListener('submit',async event=>{
    if(event.target.id==='review-form'){
      event.preventDefault();currentScene().status='approved';state.opsFilter='all';closeDialog();render();say('演示审核通过，可设为套餐展示图');return;
    }
    if(event.target.id!=='upload-form') return;
    event.preventDefault();
    const data=new FormData(event.target),file=data.get('image'),error=el('upload-error');
    const name=data.get('name').trim(),pos=data.get('position').trim();
    if(!name||!pos){error.textContent='请填写素材名称和构图备注。';return;}
    if(!['image/jpeg','image/png'].includes(file.type)||file.size>10*1024*1024){error.textContent='请选择 10 MB 以内的 JPG 或 PNG 图片。';return;}
    const url=URL.createObjectURL(file), testImage=new Image();
    testImage.src=url;
    try{await testImage.decode();}catch{URL.revokeObjectURL(url);error.textContent='图片无法解码，请换一张。';return;}
    if(!el('dialog').open||!error.isConnected){URL.revokeObjectURL(url);return;}
    const asset={id:'local-'+scenes.length,scenic:state.scenic,name,pos,source:data.get('source'),status:'draft',url};
    scenes.push(asset);state.selection=asset.id;state.opsFilter='all';closeDialog();render();say('本地素材已加入演示草稿');
  });
  render();
</script>
</body>
</html>
